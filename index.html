<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tradelify — The Operating System for Serious Traders</title>
<meta name="description" content="Tradelify helps traders fix the real problem: no structure, no discipline, no data. Trading journal, risk calculator, AI coach, demo trading, and structured education in one platform — not signals.">
<meta name="keywords" content="trading journal, risk calculator, forex trading platform, crypto trading education, demo trading, trading psychology, trading academy">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tradelify.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="Tradelify — The Operating System for Serious Traders">
<meta property="og:description" content="Most traders don't fail from bad markets. They fail from no structure. Journal, risk tools, education and AI coaching in one platform.">
<meta property="og:url" content="https://tradelify.netlify.app/">
<meta property="og:site_name" content="Tradelify">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tradelify — The Operating System for Serious Traders">
<meta name="twitter:description" content="Trading journal, risk calculator, AI coach and structured education — built for traders who want discipline, not signals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0E14;
    --panel:#11161F;
    --panel-2:#161C28;
    --line:#232B3A;
    --text:#EDEFF3;
    --muted:#8892A6;
    --mint:#3DD68C;
    --mint-dim:#1E4A38;
    --amber:#F5A623;
    --red:#F0556B;
    --radius:10px;
  }
  body.light-mode{
    --ink:#F6F7F9;
    --panel:#FFFFFF;
    --panel-2:#F0F2F5;
    --line:#E1E4E9;
    --text:#14181F;
    --muted:#6B7280;
    --mint-dim:#CFF3E1;
    color-scheme:light;
  }
  body.light-mode .mark, body.light-mode .m-menu-btn, body.light-mode .modal, body.light-mode .drawer{
    color-scheme:light;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth; color-scheme:dark;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    color-scheme:dark;
  }
  input, select, textarea, button{
    color-scheme:dark;
    accent-color:var(--mint);
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--mint); color:var(--ink);}

  /* layout helpers */
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  .hide{display:none !important;}
  button{font-family:inherit; cursor:pointer;}

  /* ---- top nav ---- */
  header.nav{
    position:sticky; top:0; z-index:50;
    background:rgba(11,14,20,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:1180px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk'; font-weight:700; font-size:20px;}
  .brand .mark{width:30px; height:30px; border-radius:7px; background:linear-gradient(135deg,var(--mint),#1f8f5f); display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700;}
  .navlinks{display:flex; gap:28px; font-size:14px; color:var(--muted);}
  .navlinks a:hover{color:var(--text);}
  .nav-actions{display:flex; gap:12px; align-items:center;}
  .btn{
    padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; border:1px solid transparent; transition:.15s;
  }
  .btn-primary{background:var(--mint); color:var(--ink);}
  .btn-primary:hover{background:#31c17e;}
  .btn-ghost{color:var(--text); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--muted);}
  @media(max-width:860px){.navlinks{display:none;}}

  /* ---- hero ---- */
  .hero{padding:100px 24px 80px; border-bottom:1px solid var(--line); position:relative; overflow:hidden;}
  .hero-grid{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:1.1fr 0.9fr; gap:60px; align-items:center;}
  @media(max-width:900px){.hero-grid{grid-template-columns:1fr;}}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--mint); font-family:'JetBrains Mono'; border:1px solid var(--mint-dim); background:rgba(61,214,140,0.06); padding:6px 12px; border-radius:100px; margin-bottom:24px;}
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--mint); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .hero h1{font-size:56px; line-height:1.05; font-weight:700; margin-bottom:22px;}
  @media(max-width:600px){.hero h1{font-size:38px;}}
  .hero h1 .accent{color:var(--mint);}
  .hero p.lead{color:var(--muted); font-size:18px; max-width:520px; margin-bottom:32px;}
  .hero-ctas{display:flex; gap:14px; margin-bottom:40px;}
  .btn-lg{padding:14px 26px; font-size:15px;}
  .problem-list{display:flex; flex-direction:column; gap:10px;}
  .problem-item{display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--muted);}
  .problem-item::before{content:"×"; color:var(--red); font-weight:700; font-family:'JetBrains Mono'; flex-shrink:0;}

  /* hero visual: mini journal card */
  .hero-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; position:relative;
  }
  .hero-card .hc-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; font-size:13px; color:var(--muted);}
  .hc-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .hc-row:last-child{border-bottom:none;}
  .tag{padding:3px 9px; border-radius:5px; font-size:11px; font-family:'JetBrains Mono'; font-weight:600;}
  .tag-win{background:rgba(61,214,140,.12); color:var(--mint);}
  .tag-loss{background:rgba(240,85,107,.12); color:var(--red);}
  .streak-box{margin-top:16px; padding:16px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .streak-num{font-family:'JetBrains Mono'; font-size:26px; font-weight:600; color:var(--mint);}

  /* ---- section shell ---- */
  section{padding:90px 0; border-bottom:1px solid var(--line);}
  .section-head{max-width:640px; margin-bottom:56px;}
  .section-head .eyebrow{margin-bottom:16px;}
  .section-head h2{font-size:36px; font-weight:700; margin-bottom:14px;}
  .section-head p{color:var(--muted); font-size:16px;}

  /* problem grid */
  .problem-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  @media(max-width:800px){.problem-grid{grid-template-columns:1fr;}}
  .p-cell{background:var(--panel); padding:28px;}
  .p-cell .num{font-family:'JetBrains Mono'; color:var(--muted); font-size:13px; margin-bottom:14px;}
  .p-cell h3{font-size:17px; margin-bottom:8px;}
  .p-cell p{color:var(--muted); font-size:14px;}

  /* feature cards */
  .feat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.feat-grid{grid-template-columns:1fr;}}
  .feat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:26px; transition:.15s;}
  .feat-card:hover{border-color:var(--mint-dim); transform:translateY(-2px);}
  .feat-icon{width:38px; height:38px; border-radius:8px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; margin-bottom:16px; font-size:18px;}
  .feat-card h3{font-size:16px; margin-bottom:8px;}
  .feat-card p{color:var(--muted); font-size:13.5px;}

  /* tools preview: calculator + journal live */
  .tool-tabs{display:flex; gap:8px; margin-bottom:28px;}
  .tool-tab{padding:9px 16px; border-radius:8px; font-size:13px; border:1px solid var(--line); color:var(--muted); background:transparent;}
  .tool-tab.active{background:var(--panel-2); color:var(--text); border-color:var(--mint-dim);}
  .tool-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:32px;}
  .calc-grid{display:grid; grid-template-columns:1fr 1fr; gap:32px;}
  @media(max-width:760px){.calc-grid{grid-template-columns:1fr;}}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-family:'JetBrains Mono';}
  .field input, .field select{
    width:100%; background:var(--ink) !important; border:1px solid var(--line); border-radius:7px; padding:11px 12px; color:var(--text) !important; font-size:14px; font-family:'JetBrains Mono';
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--mint);}
  .field input:-webkit-autofill,
  .field input:-webkit-autofill:hover,
  .field input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--text);
    -webkit-box-shadow:0 0 0px 1000px var(--ink) inset;
    transition:background-color 9999s ease-in-out 0s;
  }
  .result-box{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:12px;}
  .result-box .label{font-size:12px; color:var(--muted); font-family:'JetBrains Mono'; margin-bottom:6px;}
  .result-box .val{font-size:26px; font-weight:600; font-family:'JetBrains Mono'; color:var(--mint);}
  .rr-row{display:flex; gap:10px;}
  .rr-item{flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center;}
  .rr-item .rr-label{font-size:11px; color:var(--muted); font-family:'JetBrains Mono';}
  .rr-item .rr-val{font-family:'JetBrains Mono'; font-weight:600; margin-top:4px;}

  /* journal table */
  .j-form{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:24px; align-items:end;}
  @media(max-width:900px){.j-form{grid-template-columns:repeat(2,1fr);}}
  .j-form .field{margin-bottom:0;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--muted); font-family:'JetBrains Mono'; font-weight:500; font-size:11px; padding:10px 8px; border-bottom:1px solid var(--line);}
  td{padding:12px 8px; border-bottom:1px solid var(--line);}
  .empty-row td{color:var(--muted); text-align:center; padding:36px 0; font-size:13px;}
  .stat-strip{display:flex; gap:12px; margin-top:24px;}
  .stat-mini{flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:14px; text-align:center;}
  .stat-mini .sv{font-family:'JetBrains Mono'; font-size:20px; font-weight:600;}
  .stat-mini .sl{font-size:11px; color:var(--muted); margin-top:4px;}

  /* pricing */
  .price-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media(max-width:860px){.price-grid{grid-template-columns:1fr;}}
  .price-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:30px;}
  .price-card.featured{border-color:var(--mint); position:relative;}
  .price-card.featured::before{content:"MOST POPULAR"; position:absolute; top:-11px; left:24px; background:var(--mint); color:var(--ink); font-size:10px; font-weight:700; padding:4px 10px; border-radius:5px; letter-spacing:.05em;}
  .price-card h3{font-size:15px; color:var(--muted); font-weight:600; margin-bottom:10px;}
  .price-amt{font-family:'JetBrains Mono'; font-size:38px; font-weight:600; margin-bottom:4px;}
  .price-amt span{font-size:14px; color:var(--muted); font-weight:400;}
  .price-list{list-style:none; margin:22px 0; display:flex; flex-direction:column; gap:10px;}
  .price-list li{font-size:13.5px; color:var(--muted); display:flex; gap:8px;}
  .price-list li::before{content:"✓"; color:var(--mint); flex-shrink:0;}

  /* footer */
  footer{padding:50px 0 30px; color:var(--muted); font-size:13px;}
  .foot-inner{display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px;}

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--mint-dim); border-top:3px solid var(--mint);
    border-radius:12px; padding:32px; width:100%; max-width:400px; position:relative;
    box-shadow:0 0 0 1px rgba(61,214,140,0.05), 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(61,214,140,0.08);
  }
  .modal-close{position:absolute; top:16px; right:16px; background:none; border:none; color:var(--muted); font-size:18px;}
  .modal .mark-lg{width:40px; height:40px; border-radius:9px; background:linear-gradient(135deg,var(--mint),#1f8f5f); display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700; font-family:'Space Grotesk'; margin-bottom:18px;}
  .modal h3{font-size:20px; margin-bottom:6px;}
  .modal p.sub{color:var(--muted); font-size:13px; margin-bottom:24px;}
  .modal .field{margin-bottom:14px;}
  .modal-switch{text-align:center; margin-top:16px; font-size:13px; color:var(--muted);}
  .modal-switch a{color:var(--mint); font-weight:600;}
  .full-btn{width:100%; text-align:center; display:block;}

  /* dashboard shell */
  .app-loader{
    position:fixed; inset:0; background:var(--ink); z-index:200;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
  }
  .app-loader .mark{width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg,var(--mint),#1f8f5f); display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700; font-family:'Space Grotesk'; font-size:20px; animation:pulse 1.4s infinite;}
  #site, #dashboard{visibility:hidden;}
  body.app-ready #site, body.app-ready #dashboard{visibility:visible;}
  body.app-ready .app-loader{display:none;}
  #dashboard{display:none; min-height:100vh;}
  .dash-layout{display:grid; grid-template-columns:230px 1fr; min-height:100vh;}
  @media(max-width:800px){.dash-layout{grid-template-columns:1fr;}}
  .sidebar{border-right:1px solid var(--line); padding:20px 12px; display:flex; flex-direction:column; justify-content:space-between;}
  @media(max-width:800px){.sidebar{display:none;}}
  .side-top .brand{padding:0 10px; margin-bottom:26px;}
  .side-link{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:var(--muted); font-size:14px; margin-bottom:2px; cursor:pointer;}
  .side-link .ic{width:18px; text-align:center; font-size:14px;}
  .side-link.active{background:var(--panel-2); color:var(--text); box-shadow:inset 2px 0 0 var(--mint);}
  .side-link:hover{color:var(--text); background:var(--panel-2);}
  .side-user{display:flex; align-items:center; gap:10px; padding:12px; border-top:1px solid var(--line); margin-top:10px;}
  .side-avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#7C6CF0,#4B3FC0); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; overflow:hidden;}
  .side-user .su-name{font-size:13px; font-weight:600;}
  .side-user .su-plan{font-size:11px; color:var(--amber);}

  .notif-item{display:flex; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:10px;}
  .notif-icon{width:36px; height:36px; border-radius:8px; background:rgba(61,214,140,.12); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .notif-item h4{font-size:14px; margin-bottom:4px;}
  .notif-item p{font-size:12.5px; color:var(--muted);}
  .notif-item .notif-time{font-size:11px; color:#4d5567; margin-top:6px; font-family:'JetBrains Mono';}

  .dash-search-wrap{position:relative; flex:1; max-width:420px;}
  .dash-search-input{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 14px; color:var(--text); font-size:13px;}
  .dash-search-input:focus{outline:none; border-color:#7C6CF0;}
  .search-results-dropdown{position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; max-height:320px; overflow-y:auto; z-index:70; box-shadow:0 10px 30px rgba(0,0,0,0.4);}
  .search-result-item{padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px;}
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--panel-2);}
  .search-result-item .sr-course{font-size:11px; color:var(--muted); margin-top:3px;}
  .topbar-avatar{width:38px; height:38px; cursor:pointer;}

  .side-avatar img, .m-avatar img, .profile-avatar-lg img{width:100%; height:100%; object-fit:cover; display:block;}

  .product-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; display:flex; flex-direction:column; height:100%;}
  .product-card .product-icon{width:52px; height:52px; border-radius:10px; background:rgba(61,214,140,.12); display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:16px;}
  .product-card h3{font-size:16px; margin-bottom:8px; line-height:1.3;}
  .product-card p{font-size:13px; color:var(--muted); margin-bottom:18px; flex:1;}
  .product-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media(max-width:900px){.product-grid{grid-template-columns:1fr;}}

  /* ===== CHART ANALYSIS ===== */
  .analysis-upload-card{background:var(--panel); border:2px dashed var(--line); border-radius:14px; padding:40px 24px; text-align:center; max-width:560px; margin:0 auto 24px; cursor:pointer; transition:.15s;}
  .analysis-upload-card:hover{border-color:#7C6CF0;}
  .analysis-upload-card .au-icon{font-size:36px; margin-bottom:12px;}
  .analysis-preview-wrap{max-width:560px; margin:0 auto 20px; text-align:center;}
  .analysis-preview-wrap img{max-width:100%; border-radius:12px; border:1px solid var(--line);}
  .analysis-results{max-width:560px; margin:0 auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px;}
  .analysis-section{display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);}
  .analysis-section:last-child{border-bottom:none;}
  .analysis-section .as-icon{width:36px; height:36px; border-radius:8px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .analysis-section h4{font-size:13.5px; margin-bottom:4px;}
  .analysis-section p{font-size:13px; color:var(--muted); line-height:1.5;}
  .analysis-pending-badge{display:inline-block; background:rgba(245,166,35,.12); color:var(--amber); font-size:11px; padding:3px 9px; border-radius:5px; font-family:'JetBrains Mono'; margin-top:14px;}

  .broker-disclosure{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:12.5px; color:var(--muted); max-width:640px; margin:0 auto 24px;}
  .broker-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; display:flex; flex-direction:column; height:100%;}
  .broker-card .broker-icon{width:52px; height:52px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:14px;}
  .broker-card h3{font-size:16px; margin-bottom:8px;}
  .broker-card p{font-size:13px; color:var(--muted); margin-bottom:16px; flex:1;}
  .broker-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media(max-width:900px){.broker-grid{grid-template-columns:1fr;}}

  .billing-plan-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:28px;}
  @media(max-width:900px){.billing-plan-grid{grid-template-columns:1fr;}}
  .billing-plan-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px; position:relative;}
  .billing-plan-card.current{border-color:var(--mint);}
  .billing-plan-card.featured{border-color:#7C6CF0;}
  .billing-current-tag{position:absolute; top:-11px; left:20px; background:var(--mint); color:var(--ink); font-size:10px; font-weight:700; padding:4px 10px; border-radius:5px;}
  .billing-plan-card h3{font-size:15px; color:var(--muted); margin-bottom:8px;}
  .billing-price{font-family:'JetBrains Mono'; font-size:32px; font-weight:700; margin-bottom:16px;}
  .billing-price span{font-size:13px; color:var(--muted); font-weight:400;}
  .billing-plan-card ul{list-style:none; margin-bottom:20px;}
  .billing-plan-card li{font-size:13px; color:var(--muted); margin-bottom:8px; display:flex; gap:8px;}
  .billing-plan-card li::before{content:"✓"; color:var(--mint); flex-shrink:0;}

  /* ===== SETTINGS ===== */
  .settings-section{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; max-width:520px; margin-bottom:20px;}
  .settings-section h3{font-size:15px; margin-bottom:16px;}

  /* ===== CALENDAR ===== */

  /* ===== ADMIN PANEL ===== */

  /* ===== QUIZ ===== */
  .quiz-start-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:32px; max-width:480px; margin:0 auto; text-align:center;}
